name: Deploy to GitHub Pages

# The game is a static site with no build step, so Pages serves the repository
# root as-is. `enablement: true` turns Pages on for the repo the first time this
# runs, so there is nothing to click in Settings.

on:
  push:
    branches:
      - claude/jungfrau-flight-game-808sr9
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # Publish only what the browser actually loads — the baking and test
      # tooling has no business on the public site, and leaving it out keeps
      # the upload to the game itself.
      - name: Stage the runtime files
        run: |
          mkdir -p _site
          cp index.html .nojekyll _site/
          cp -r src vendor data _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
