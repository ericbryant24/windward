name: Deploy to GitHub Pages

# The game is a static site with no build step, so this just stages the files
# the browser needs and hands them to Pages.
#
# Pages itself has to be switched on once by hand, under
# Settings -> Pages -> Build and deployment -> Source: GitHub Actions. The
# workflow token is not allowed to create the Pages site itself, on public or
# private repositories, so asking it to only produced a confusing failure.
#
# Which branches may deploy is a setting, not something this file controls:
# Settings -> Environments -> github-pages -> Deployment branches and tags.
# GitHub writes that allowlist once, naming whichever branch was the default
# when the environment was created, and never revises it — renaming the default
# branch afterwards leaves the old name sitting in the list, still the only one
# allowed through.
#
# A branch that is not on the list fails in a way that looks like nothing at
# all: verify passes, then deploy is refused a runner and finishes in a second
# with no steps, no logs and an empty check-run body. There is no message
# anywhere saying the branch was the problem. If a deploy fails and the job
# never ran, look at the environment before you look at the build.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # An offline app that ships with a module missing from its precache is broken
  # in the one place nobody looks: on a phone, in a tunnel, a week later. This
  # runs the worker's own crawler over the tree and fails the deploy if a file
  # on disk is not reachable from index.html. No browser, so it costs seconds;
  # the full offline flight test needs Chromium and is run by hand.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/verify-sw.mjs --no-browser

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # Publish only what the browser actually loads — the baking and test
      # tooling has no business on the public site, and leaving it out keeps
      # the upload to the game itself.
      # sw.js goes at the root of the published site and nowhere else: a service
      # worker can only control the directory it is served from, and the site
      # root is /windward/ here.
      - name: Stage the runtime files
        run: |
          mkdir -p _site
          cp index.html .nojekyll sw.js manifest.webmanifest _site/
          cp -r src vendor data icons _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
